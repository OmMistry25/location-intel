[tool.uv.workspace]
members = ["packages/ingestion", "packages/intelligence"]

[dependency-groups]
dev = [
    "ruff==0.15.14",
    "pyright==1.1.409",
    "pytest==9.0.3",
]

[tool.ruff]
target-version = "py311"
src = ["packages/ingestion/src", "packages/intelligence/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = [
    "packages/ingestion/src",
    "packages/ingestion/tests",
    "packages/intelligence/src",
    "packages/intelligence/tests",
]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = [
    "packages/ingestion/tests",
    "packages/intelligence/tests",
]
